name: Build & Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: 'Also publish a DRAFT release (not public, not "latest") to check the installers'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Check the tag matches package.json (the auto-updater relies on it)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: npm test
      - name: Build
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml

  # Woof Tweaks for Android ships with every release (same version number). Signed with the Woof Android key
  # (repository secrets); the .sha256 file lets the app verify its own updates.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.WOOF_ANDROID_KEYSTORE_B64 }}
          WOOF_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WOOF_ANDROID_KEYSTORE_PASSWORD }}
          WOOF_ANDROID_KEY_ALIAS: ${{ secrets.WOOF_ANDROID_KEY_ALIAS }}
          WOOF_ANDROID_KEY_PASSWORD: ${{ secrets.WOOF_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Missing the WOOF_ANDROID_KEYSTORE_B64 secret"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/woof-android.p12"
          export WOOF_ANDROID_KEYSTORE="$RUNNER_TEMP/woof-android.p12"
          gradle --no-daemon testReleaseUnitTest assembleRelease
          rm -f "$RUNNER_TEMP/woof-android.p12"
          v=$(node -p "require('../package.json').version")
          mkdir -p ../dist-android
          cp app/build/outputs/apk/release/app-release.apk "../dist-android/Woof-Tweaks-Android-$v.apk"
          cd ../dist-android && sha256sum "Woof-Tweaks-Android-$v.apk" > "Woof-Tweaks-Android-$v.apk.sha256" && cat *.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist-android/*

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.draft
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('draft-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Draft build {0} (test only)', github.run_number) }}
