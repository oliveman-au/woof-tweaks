name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  # Applies EVERY tweak on a real, throwaway machine, reverts everything, and fails if any setting
  # isn't exactly back to how it was. This is the "full run" on real Windows / macOS / Linux.
  system:
    needs: unit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      WOOF_ELEVATE: sudo
      WOOF_REPORT: full-run-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Process list before
        if: runner.os == 'Linux'
        run: ps -eo pid,ppid,user,stat,args --sort=pid > /tmp/ps-before.txt
      - name: Apply all tweaks, revert, compare
        run: node test/system/full-run.js
        env:
          WOOF_DEBUG: '1'
          WOOF_ONE_BY_ONE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          # System services that Revert restarts would otherwise inherit the runner's tracking id and
          # make its orphan-process cleanup hang. (The next step lists anything new, so leftovers still show.)
          RUNNER_TRACKING_ID: ''
      - name: Processes started during the run (should be none)
        if: always() && runner.os == 'Linux'
        run: |
          ps -eo pid,ppid,user,stat,args --sort=pid > /tmp/ps-after.txt
          awk 'NR==FNR{seen[$1]=1;next} !($1 in seen)' /tmp/ps-before.txt /tmp/ps-after.txt | grep -vE " ps -eo| awk |bash -e" || echo "none"
          # Daemons restarted by Revert / package installs (not app leftovers) — stop them so the runner's cleanup can't hang.
          sudo systemctl stop packagekit ModemManager 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        # the Linux runner can stall here after Revert restarts system services; the report is a nice-to-have
        timeout-minutes: 3
        continue-on-error: true
        with:
          name: full-run-${{ matrix.os }}
          path: full-run-report.json

  # Launches the real app: UI loads with no errors, single instance, and clicking X quits everything.
  app:
    needs: unit
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Quit test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/system/quit-test.js
      - name: Quit test
        if: runner.os != 'Linux'
        run: node test/system/quit-test.js
      - name: Background updater test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/system/background-test.js
      - name: Background updater test
        if: runner.os != 'Linux'
        run: node test/system/background-test.js

  # Woof Tweaks for Android: unit tests, lint, a release build, then every tweak applied + reverted on a real
  # Android emulator (with the same one-time permissions a user grants).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1
      - name: Unit tests, lint, release build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Every tweak on a real Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: false
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/androidTest-results
          retention-days: 7
