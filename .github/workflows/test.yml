name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  # Applies EVERY tweak on a real, throwaway machine, reverts everything, and fails if any setting
  # isn't exactly back to how it was. This is the "full run" on real Windows / macOS / Linux.
  system:
    needs: unit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      WOOF_ELEVATE: sudo
      WOOF_REPORT: full-run-report.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Process list before
        if: runner.os == 'Linux'
        run: ps -eo pid,ppid,user,stat,args --sort=pid > /tmp/ps-before.txt
      - name: Apply all tweaks, revert, compare
        run: node test/system/full-run.js
        env:
          WOOF_DEBUG: '1'
          WOOF_ONE_BY_ONE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - name: Processes started during the run (should be none)
        if: always() && runner.os == 'Linux'
        run: |
          ps -eo pid,ppid,user,stat,args --sort=pid > /tmp/ps-after.txt
          awk 'NR==FNR{seen[$1]=1;next} !($1 in seen)' /tmp/ps-before.txt /tmp/ps-after.txt | grep -vE " ps -eo| awk |bash -e" || echo "none"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-run-${{ matrix.os }}
          path: full-run-report.json

  # Launches the real app: UI loads with no errors, single instance, and clicking X quits everything.
  app:
    needs: unit
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Quit test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node test/system/quit-test.js
      - name: Quit test
        if: runner.os != 'Linux'
        run: node test/system/quit-test.js
