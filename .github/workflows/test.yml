name: Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm test

  # Applies EVERY tweak on a real, throwaway machine, reverts everything, and fails if any setting
  # isn't exactly back to how it was. This is the "full run" on real Windows / macOS / Linux.
  system:
    needs: unit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      WOOF_ELEVATE: sudo
      WOOF_REPORT: full-run-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Apply all tweaks, revert, compare
        run: node test/system/full-run.js
        env:
          WOOF_DEBUG: '1'
          WOOF_ONE_BY_ONE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-run-${{ matrix.os }}
          path: full-run-report.json
